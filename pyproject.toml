[project]
name = "systeme-de-recommendation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "charfx", email = "charifisaad123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
systeme-de-recommendation = "systeme_de_recommendation:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
